<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Insider</title>
<meta name="description" content="Insider buying that matters: clustered open-market purchases by executives, scored and explained.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insider">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--bg2:#11151a;--bg3:#171c23;--line:#222a33;--line2:#2c3641;--ink:#e8ecf1;--ink2:#9aa6b4;--ink3:#5f6b79;
--up:#3ddc97;--up2:rgba(61,220,151,.14);--strong:#ffb547;--strong2:rgba(255,181,71,.14);--down:#ff6b6b;--blue:#6ea8ff;
--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;--r:14px;
--pad:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--blue);text-decoration:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,rgba(11,13,16,0));padding:calc(10px + var(--safe-t)) var(--pad) 10px;display:flex;align-items:center;gap:10px}
header .mark{width:26px;height:26px;border-radius:7px;background:var(--up);display:grid;place-items:center;color:#06120c;font:700 15px var(--mono)}
header h1{font-size:17px;margin:0;letter-spacing:.2px;flex:1}
header .upd{font:12px var(--mono);color:var(--ink3)}
main{padding:0 var(--pad) calc(84px + var(--safe-b));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(13,16,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe-b))}
nav.tabs button{background:none;border:0;color:var(--ink3);font:500 11px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 10px;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--up)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 16px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.stat .v{font:600 20px/1.1 var(--mono);letter-spacing:-.3px}
.stat .k{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.stat .v.up{color:var(--up)}.stat .v.down{color:var(--down)}.stat .v.strong{color:var(--strong)}
h2{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);margin:18px 0 10px;font-weight:600}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;position:relative}
.card.tap:active{background:var(--bg3)}
.row{display:flex;align-items:center;gap:10px}
.tk{font:600 18px var(--mono);letter-spacing:-.2px}
.nm{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 10.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid}
.pill.Strong{color:var(--strong);border-color:rgba(255,181,71,.45);background:var(--strong2)}
.pill.Notable{color:var(--up);border-color:rgba(61,220,151,.45);background:var(--up2)}
.pill.Weak{color:var(--ink3);border-color:var(--line2)}
.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 13px var(--mono)}
.lead{margin:10px 0 8px;font-size:14px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font:12.5px var(--mono);color:var(--ink2)}
.facts b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:600}
.spark{width:100%;height:44px;margin-top:10px}
.perf{display:inline-flex;gap:6px;align-items:baseline;font:12.5px var(--mono)}
.perf .up{color:var(--up)}.perf .down{color:var(--down)}
.empty{color:var(--ink3);text-align:center;padding:40px 20px;font-size:14px;line-height:1.6}
.btn{background:var(--up);color:#06120c;border:0;border-radius:11px;padding:12px 16px;font:600 14px var(--sans);width:100%}
.btn.ghost{background:var(--bg3);color:var(--ink);border:1px solid var(--line2)}
.btn:disabled{opacity:.5}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.5}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink);font:14px var(--sans);outline:0;margin:6px 0 12px}
.search::placeholder{color:var(--ink3)}
/* detail */
.detail .back{background:none;border:0;color:var(--blue);font:500 14px var(--sans);padding:6px 0 10px;display:flex;align-items:center;gap:4px}
.hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.hd .tk{font-size:30px}
.hd .nm{white-space:normal;font-size:14px}
.bars{display:grid;gap:7px;margin:8px 0 4px}
.bar{display:grid;grid-template-columns:86px 1fr 34px;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.bar .tr{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--up);border-radius:4px}
.bar .fl.neg{background:var(--down)}
.bar .pv{font:500 12px var(--mono);text-align:right;color:var(--ink)}
ul.reasons{margin:6px 0 0;padding:0 0 0 18px;color:var(--ink2);font-size:13.5px;line-height:1.5}
ul.reasons li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font:600 10.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono)}
td .sub{color:var(--ink3);font-size:11.5px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv div{background:var(--bg3);border-radius:10px;padding:9px 10px}
.kv .k{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.kv .v{font:500 14px var(--mono);margin-top:2px}
.take{border-left:3px solid var(--strong);padding:2px 0 2px 12px;margin-top:8px}
.take.Notable{border-color:var(--up)}.take.Weak{border-color:var(--ink3)}
.take b{display:block;margin-bottom:4px;font-size:14px}
.take p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.55}
.disc{font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.5}
.links a{display:inline-block;margin:6px 10px 0 0;font:12.5px var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);padding:10px 14px;border-radius:12px;font-size:13px;z-index:9;max-width:90vw}
.buy{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.buy .tk{font-size:15px}
.buy .who{color:var(--ink2);font-size:12.5px}
.buy .amt{font:500 13px var(--mono);text-align:right}
.buy .d{font:11.5px var(--mono);color:var(--ink3);text-align:right}
.step{display:flex;gap:10px;margin:10px 0;font-size:13.5px;color:var(--ink2)}
.step i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);display:grid;place-items:center;font:600 11px var(--mono);color:var(--ink);font-style:normal}
.ok{color:var(--up)}.warn{color:var(--strong)}
</style>
</head>
<body>
<header><div class="mark">I</div><h1>Insider</h1><div class="upd" id="upd"></div></header>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-tab="alerts"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 004 0"/></svg>Alerts</button>
  <button data-tab="browse"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M8 19v-7"/><path d="M12 19V9"/><path d="M16 19v-4"/><path d="M20 19V7"/></svg>Companies</button>
  <button data-tab="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
</nav>
<script>
const $ = s => document.querySelector(s);
const D = {summary:null, alerts:[], companies:{}, buys:[], runs:[], config:{}};
let tab = "home", detail = null;
const fmt = {
  money(v){ if(v==null) return "—"; const a=Math.abs(v); const u=[["T",1e12],["B",1e9],["M",1e6],["K",1e3]]; for(const [s,d] of u) if(a>=d){ const x=v/d; return "$"+(s==="K"||Math.abs(x)>=100?x.toFixed(0):Math.abs(x)>=10?x.toFixed(1):x.toFixed(2))+s; } return "$"+Math.round(v).toLocaleString(); },
  pct(v,d=0){ return v==null?"—":(v>0?"+":"")+(v*100).toFixed(d)+"%"; },
  px(v){ return v==null?"—":"$"+Number(v).toFixed(2); },
  int(v){ return v==null?"—":Math.round(v).toLocaleString(); },
  date(s){ if(!s) return "—"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); },
  ago(iso){ if(!iso) return ""; const m=Math.round((Date.now()-new Date(iso))/60000); return m<2?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; }
};
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function j(name){ try{ const r=await fetch(name+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return null; } }
async function load(){
  const [s,a,c,b,r,cfg] = await Promise.all([j("data/summary.json"),j("data/alerts.json"),j("data/companies.json"),j("data/buys.json"),j("data/runs.json"),j("config.json")]);
  D.summary=s; D.alerts=(a||[]).slice().reverse(); D.companies=c||{}; D.buys=(b||[]).slice().sort((x,y)=>y.trade_date.localeCompare(x.trade_date)); D.runs=r||[]; D.config=cfg||{};
  $("#upd").textContent = s ? "scan " + fmt.ago(s.updated) : "";
  render();
}
function ring(score,label){ const r=18,c=2*Math.PI*r,col=label==="Strong"?"var(--strong)":label==="Notable"?"var(--up)":"var(--ink3)";
  return `<div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" stroke="var(--bg3)" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="${r}" stroke="${col}" stroke-width="4" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(score,100)/100)}" stroke-linecap="round"/></svg><div class="t">${score}</div></div>`; }
function spark(pts, markDate){ if(!pts||pts.length<2) return ""; const w=300,h=44,vals=pts.map(p=>p[1]),mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const X=i=>(i/(pts.length-1))*w, Y=v=>h-3-((v-mn)/sp)*(h-6); let d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const up=vals[vals.length-1]>=vals[0]; let mark=""; if(markDate){ const i=pts.findIndex(p=>p[0]>=markDate); if(i>=0) mark=`<circle cx="${X(i)}" cy="${Y(pts[i][1])}" r="3.2" fill="var(--strong)"/>`; }
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="1.6"/>${mark}</svg>`; }
function alertCard(a){
  const c=a.ctx||{}, p=a.perf||{};
  const perf = (p.ret!=null && p.days>=1) ? `<span class="perf">since alert <b class="${p.ret>=0?"up":"down"}">${fmt.pct(p.ret,1)}</b>${p.spy!=null?`<span style="color:var(--ink3)">vs S&amp;P ${fmt.pct(p.spy,1)}</span>`:""}</span>` : "";
  const who = (a.buyers||[]).filter(b=>!b.fund).slice(0,3).map(b=>`<span class="chip"><b>${esc(b.role)}</b> ${fmt.money(b.value)}</span>`).join("");
  return `<div class="card tap" data-alert="${esc(a.id)}">
    <div class="row">${ring(a.score,a.label)}<div style="flex:1;min-width:0"><div class="row" style="gap:8px"><span class="tk">${esc(a.ticker||"—")}</span><span class="pill ${a.label}">${a.label}</span></div><div class="nm">${esc(a.name)}</div></div><div class="num" style="color:var(--ink3);font-size:12px">${fmt.date(a.date)}</div></div>
    <div class="lead">${a.n_insiders} insider${a.n_insiders===1?"":"s"} bought <b class="num">${fmt.money(a.total_value)}</b> at ~<span class="num">${fmt.px(a.avg_price)}</span>${c.price?` · now <span class="num">${fmt.px(c.price)}</span>`:""}</div>
    <div class="facts">${c.market_cap?`<span><b>${fmt.money(c.market_cap)}</b> cap</span>`:""}${c.off_high!=null?`<span><b>${fmt.pct(c.off_high)}</b> vs 52w high</span>`:""}${c.chg_30d!=null?`<span><b>${fmt.pct(c.chg_30d)}</b> 30d</span>`:""}${c.industry?`<span>${esc(c.industry)}</span>`:""}</div>
    <div class="chips">${who}</div>${spark(a.spark,a.date)}${perf?`<div style="margin-top:6px">${perf}</div>`:""}</div>`; }
function home(){
  const s=D.summary; if(!s) return `<div class="empty">No scans yet.<br>The first run fills this in within 10 minutes of going live.</div>`;
  const strong=D.alerts.filter(a=>a.label==="Strong").slice(0,3), latest=D.alerts.filter(a=>!strong.includes(a)).slice(0,5);
  return `<div class="strip">
    <div class="stat"><div class="v strong">${s.strong_30d}</div><div class="k">Strong · 30d</div></div>
    <div class="stat"><div class="v">${s.alerts_30d}</div><div class="k">Alerts · 30d</div></div>
    <div class="stat"><div class="v">${fmt.int(s.buys_30d)}</div><div class="k">Buys scanned</div></div>
    <div class="stat"><div class="v ${s.avg_vs_spy==null?"":s.avg_vs_spy>=0?"up":"down"}">${s.avg_vs_spy==null?"—":fmt.pct(s.avg_vs_spy,1)}</div><div class="k">vs S&amp;P${s.n_perf?` · ${s.n_perf}`:""}</div></div></div>
    ${!standalone()&&isIOS()?`<div class="card" style="border-color:rgba(255,181,71,.4)"><b>Add Insider to your Home Screen</b><div class="hint" style="margin-top:4px">Tap Share <span style="font-size:15px">⎙</span> → <b>Add to Home Screen</b>, then open it from there and turn on notifications in Settings. iPhone only sends push to home-screen apps.</div></div>`:""}
    ${Notification && Notification.permission!=="granted" && standalone() ? `<div class="card"><b>Notifications are off</b><div class="hint" style="margin:4px 0 10px">Turn them on to get strong signals on your lock screen.</div><button class="btn" onclick="go('settings')">Set up notifications</button></div>`:""}
    <h2>Strongest right now</h2>${strong.length?strong.map(alertCard).join(""):`<div class="empty">No strong clusters in the last 30 days. That's normal — strong signals come a few times a month, not daily.</div>`}
    ${latest.length?`<h2>More alerts</h2>`+latest.map(alertCard).join(""):""}
    ${s.n_perf?`<h2>Track record</h2><div class="card"><div class="kv"><div><div class="k">Alerts aged 30d+</div><div class="v">${s.n_perf}</div></div><div><div class="k">Beat the S&amp;P</div><div class="v">${fmt.pct(s.hit_rate)}</div></div><div><div class="k">Avg return</div><div class="v ${s.avg_ret>=0?"ok":"warn"}">${fmt.pct(s.avg_ret,1)}</div></div><div><div class="k">Avg vs S&amp;P</div><div class="v ${s.avg_vs_spy>=0?"ok":"warn"}">${fmt.pct(s.avg_vs_spy,1)}</div></div></div><div class="hint" style="margin-top:8px">Measured from the alert day's close. Small samples swing; judge it after dozens of alerts, not a handful.</div></div>`:""}`;
}
function alerts(){
  const f = D._f || "all"; const list = D.alerts.filter(a=>f==="all"||a.label===f);
  return `<div class="row" style="gap:8px;margin:6px 0 12px">${["all","Strong","Notable"].map(k=>`<button class="pill ${k==="all"?"Weak":k}" style="padding:7px 12px;font-size:11.5px;${f===k?"outline:2px solid var(--ink2)":""}" onclick="D._f='${k}';render()">${k==="all"?"All":k}</button>`).join("")}<span style="flex:1"></span><span class="hint">${list.length}</span></div>
    ${list.length?list.map(alertCard).join(""):`<div class="empty">No alerts yet.</div>`}`;
}
function browse(){
  const q=(D._q||"").toLowerCase(); const rows=Object.values(D.companies).filter(c=>!q||(c.ticker||"").toLowerCase().includes(q)||(c.name||"").toLowerCase().includes(q)).sort((a,b)=>b.score.score-a.score.score||b.updated.localeCompare(a.updated));
  return `<input class="search" placeholder="Search ticker or company" value="${esc(D._q||"")}" oninput="D._q=this.value;renderList()"><div id="list">${companyRows(rows)}</div>`;
}
function companyRows(rows){ if(!rows.length) return `<div class="empty">Nothing tracked yet.</div>`;
  return rows.slice(0,200).map(c=>`<div class="card tap" data-co="${esc(c.ticker||"cik"+c.cik)}" style="padding:12px 14px"><div class="row">${ring(c.score.score,c.score.label)}<div style="flex:1;min-width:0"><div class="row" style="gap:8px"><span class="tk">${esc(c.ticker||"—")}</span><span class="pill ${c.score.label}">${c.score.label}</span></div><div class="nm">${esc(c.name)}</div></div><div style="text-align:right"><div class="num" style="font-size:13px">${fmt.money(c.score.total_value)}</div><div class="num" style="font-size:11px;color:var(--ink3)">${c.score.n_insiders} insider${c.score.n_insiders===1?"":"s"} · ${fmt.date(c.score.last_trade)}</div></div></div></div>`).join(""); }
function renderList(){ const q=(D._q||"").toLowerCase(); const rows=Object.values(D.companies).filter(c=>!q||(c.ticker||"").toLowerCase().includes(q)||(c.name||"").toLowerCase().includes(q)).sort((a,b)=>b.score.score-a.score.score); $("#list").innerHTML=companyRows(rows); bind(); }
function activity(){
  const b=D.buys.slice(0,150);
  return `<div class="hint" style="margin:6px 0 10px">Every open-market insider buy the scanner has read, newest first. Most of these are routine; the scoring exists to find the few that aren't.</div>
    ${b.length?b.map(x=>`<div class="buy tap" data-co="${esc(x.company.ticker||"cik"+x.company.cik)}"><div><span class="tk">${esc(x.company.ticker||x.company.name)}</span> <span class="who">${esc(x.owner.name)} · ${esc(roleOf(x.owner))}${x.plan_10b5_1?" · 10b5-1":""}</span></div><div class="amt">${fmt.money(x.value)}</div><div class="who">${fmt.int(x.shares)} sh @ ${fmt.px(x.price)} → owns ${fmt.int(x.owned_after)}</div><div class="d">${fmt.date(x.trade_date)}</div></div>`).join(""):`<div class="empty">No buys read yet.</div>`}`;
}
function roleOf(o){ const t=(o.title||"").toLowerCase(); if(o.officer||t){ if(/chief exec|\bceo\b/.test(t)) return "CEO"; if(/chief fin|\bcfo\b/.test(t)) return "CFO"; if(/chief oper|\bcoo\b/.test(t)) return "COO"; if(/president/.test(t)) return "President"; if(/chair/.test(t)) return "Chair"; if(/chief/.test(t)) return "C-suite"; if(/vice|\bvp\b|\bevp\b|\bsvp\b/.test(t)) return "VP"; return "Officer"; } if(o.director) return "Director"; if(o.ten_percent) return "10% owner"; return "Insider"; }
function settings(){
  const perm = ("Notification" in window) ? Notification.permission : "unsupported";
  const last = D.summary && D.summary.last_run;
  return `<h2>Notifications</h2><div class="card">
    ${!("serviceWorker" in navigator)||!("PushManager" in window)?`<div class="warn">This browser can't receive push.${isIOS()&&!standalone()?" On iPhone, add Insider to your Home Screen first (Share → Add to Home Screen) and open it from there.":""}</div>`:
      perm==="granted"&&localStorage.getItem("insider.sub")?`<div class="ok">✓ This device gets alerts.</div><div class="hint" style="margin-top:6px">Reinstalled or notifications stopped? Register again below.</div><button class="btn ghost" style="margin-top:10px" onclick="subscribe()">Register this device again</button><button class="btn ghost" style="margin-top:8px" onclick="testPush()">Show a test notification</button>`:
      perm==="denied"?`<div class="warn">Notifications are blocked for Insider. iPhone: Settings → Notifications → Insider → Allow.</div>`:
      `<div class="hint" style="margin-bottom:10px">Two taps: allow notifications, then confirm the device on GitHub (it opens a pre-filled page — just press <b>Submit new issue</b>). That's how this phone tells the scanner where to send alerts.</div>
       <div class="step"><i>1</i><span>Allow notifications when iPhone asks.</span></div><div class="step"><i>2</i><span>A GitHub page opens. Tap <b>Submit new issue</b>. Done.</span></div>
       <button class="btn" onclick="subscribe()">Turn on notifications</button>`}
    <div id="submsg" class="hint" style="margin-top:8px"></div></div>
    <h2>What gets an alert</h2><div class="card hint" style="font-size:13px;color:var(--ink2)">
      <p style="margin:0 0 8px">Only <b>open-market purchases</b> (Form 4 code P). Sales, option exercises, tax withholding and gifts are ignored — they carry no signal.</p>
      <p style="margin:0 0 8px">Score, out of 100: <b>cluster</b> of insiders within 30 days (up to 40) · <b>role</b> of the top buyer (CEO/CFO 20 … director 8) · <b>size</b> of the buy and how much it grows their stake (up to 25) · <b>company size</b>, small caps favored (up to 10) · <b>buying a drop</b> (up to 14) · minus pre-scheduled 10b5-1 buys and fund-only activity.</p>
      <p style="margin:0"><span class="pill Strong">Strong</span> 65+ (and $100K+ combined; a lone insider needs $250K+) &nbsp; <span class="pill Notable">Notable</span> 40–64 &nbsp; <span class="pill Weak">Weak</span> logged only. Each company alerts at most once a month unless its score jumps.</p></div>
    <h2>Scanner</h2><div class="card">${last?`<div class="kv"><div><div class="k">Last scan</div><div class="v">${fmt.ago(last.at)}</div></div><div><div class="k">Filings read</div><div class="v">${last.new} / ${last.filings}</div></div><div><div class="k">Buys found</div><div class="v">${last.buys}</div></div><div><div class="k">Errors</div><div class="v ${last.errors?"warn":""}">${last.errors}</div></div></div>
      <div class="hint" style="margin-top:8px">Runs every 10 minutes on GitHub Actions, reading the SEC's EDGAR feed directly. Filings land up to 2 business days after the trade — that lag is the law, not the scanner.</div>`:`<div class="hint">No run recorded yet.</div>`}
      ${D.config.repo?`<div class="links"><a href="https://github.com/${esc(D.config.repo)}/actions" target="_blank" rel="noopener">Run history ↗</a><a href="https://github.com/${esc(D.config.repo)}" target="_blank" rel="noopener">Code ↗</a></div>`:""}</div>
    <div class="disc">Insider is information, not advice. Insider buying has shown a modest average edge over 6–12 months in academic studies, with wide dispersion; nothing here predicts any single stock. Source data: U.S. SEC EDGAR; prices: Yahoo Finance.</div>`;
}
function detailView(a, isCompany){
  const c=a.ctx||{}, sc=isCompany?a.score:a, p=a.perf||{};
  const pts=sc.points||{}; const maxes={cluster:40,role:20,size:25,cap:10,dip:14,penalty:-15}; const labels={cluster:"Cluster",role:"Role",size:"Size",cap:"Company size",dip:"Buying a drop",penalty:"Penalties"};
  const bars=Object.keys(labels).map(k=>{const v=pts[k]||0, m=Math.abs(maxes[k]); return `<div class="bar"><span>${labels[k]}</span><div class="tr"><div class="fl ${v<0?"neg":""}" style="width:${Math.min(100,Math.abs(v)/m*100)}%"></div></div><span class="pv">${v>0?"+":""}${v}</span></div>`;}).join("");
  const buyers=(sc.buyers||[]).map(b=>`<tr><td><b>${esc(b.name)}</b><div class="sub">${esc(b.role)}${b.fund?" · fund entity":""}${b.plan?" · 10b5-1 plan":""}${b.direct?"":" · indirect"} · ${fmt.date(b.first)}${b.last!==b.first?"–"+fmt.date(b.last):""}</div></td><td class="n">${fmt.money(b.value)}<div class="sub">${fmt.int(b.shares)} sh @ ${fmt.px(b.avg_price)}</div></td><td class="n">${b.stake_increase==null?"new":fmt.pct(b.stake_increase)}<div class="sub">owns ${fmt.int(b.owned_after)}</div></td></tr>`).join("");
  const filings=(a.filings||[]).slice(0,8).map(x=>`<a href="https://www.sec.gov/Archives/edgar/data/${esc(a.cik)}/${esc(String(x).replace(/-/g,""))}/" target="_blank" rel="noopener">${esc(x)} ↗</a>`).join("");
  return `<div class="detail"><button class="back" onclick="detail=null;render()">‹ Back</button>
    <div class="hd">${ring(sc.score,sc.label)}<div style="flex:1;min-width:0"><div class="row" style="gap:10px"><span class="tk">${esc(a.ticker||"—")}</span><span class="pill ${sc.label}">${sc.label}</span></div><div class="nm">${esc(a.name)}${c.industry?` · ${esc(c.industry)}`:""}${c.exchange?` · ${esc(c.exchange)}`:""}</div></div></div>
    ${spark(a.spark, isCompany?null:a.date)}
    <div class="kv" style="margin-top:10px"><div><div class="k">Price</div><div class="v">${fmt.px(c.price)}</div></div><div><div class="k">Insiders paid</div><div class="v">${fmt.px(sc.avg_price)}</div></div><div><div class="k">Market cap</div><div class="v">${fmt.money(c.market_cap)}</div></div><div><div class="k">vs 52w high</div><div class="v ${c.off_high<-0.15?"warn":""}">${fmt.pct(c.off_high)}</div></div><div><div class="k">30d / 90d / 1y</div><div class="v" style="font-size:12.5px">${fmt.pct(c.chg_30d)} · ${fmt.pct(c.chg_90d)} · ${fmt.pct(c.chg_1y)}</div></div><div><div class="k">52w range</div><div class="v" style="font-size:12.5px">${fmt.px(c.low_52w)} – ${fmt.px(c.high_52w)}</div></div></div>
    ${p.ret!=null?`<div class="card" style="margin-top:10px"><div class="row"><div style="flex:1"><div class="k hint" style="text-transform:uppercase;letter-spacing:.6px;font-size:10.5px">Since alert · ${p.days} days</div><div class="num" style="font-size:22px" class="${p.ret>=0?"ok":"warn"}"><span class="${p.ret>=0?"ok":"warn"}">${fmt.pct(p.ret,1)}</span></div></div><div style="text-align:right"><div class="k hint" style="text-transform:uppercase;letter-spacing:.6px;font-size:10.5px">S&amp;P same period</div><div class="num" style="font-size:22px">${fmt.pct(p.spy,1)}</div></div></div></div>`:""}
    <h2>Why this score</h2><div class="card"><div class="bars">${bars}</div><ul class="reasons">${(sc.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>
    <h2>The read</h2><div class="card"><div class="take ${sc.label}"><b>${esc(sc.take?.headline||"")}</b><p>${esc(sc.take?.body||"")}</p></div><div class="facts" style="margin-top:10px"><span>Horizon <b>${esc(sc.take?.horizon||"6–12 months")}</b></span><span>Studied edge <b>${esc(sc.take?.studied_edge||"")}</b></span></div></div>
    <h2>Who bought</h2><div class="card" style="padding:6px 14px"><table><thead><tr><th>Insider</th><th class="n">Bought</th><th class="n">Stake +</th></tr></thead><tbody>${buyers}</tbody></table></div>
    ${filings?`<h2>Filings</h2><div class="card links" style="padding-top:8px">${filings}</div>`:""}
    <div class="disc">Information, not a recommendation. Form 4 data is self-reported and occasionally amended.</div></div>`;
}
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  let html;
  if(detail){ html = detail.kind==="alert" ? detailView(D.alerts.find(a=>a.id===detail.id)||{}) : detailView(D.companies[detail.id]||{}, true); }
  else html = {home,alerts,browse,activity,settings}[tab]();
  $("#main").innerHTML = html; window.scrollTo(0,0); bind();
}
function bind(){
  document.querySelectorAll("[data-alert]").forEach(el=>el.onclick=()=>{detail={kind:"alert",id:el.dataset.alert};render();});
  document.querySelectorAll("[data-co]").forEach(el=>el.onclick=()=>{ if(D.companies[el.dataset.co]){detail={kind:"company",id:el.dataset.co};render();} });
}
function go(t){ tab=t; detail=null; render(); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function standalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function b64(s){ const p="=".repeat((4-s.length%4)%4), b=(s+p).replace(/-/g,"+").replace(/_/g,"/"), r=atob(b); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
async function subscribe(){
  const msg=$("#submsg");
  try{
    if(!D.config.vapid_public){ msg.textContent="The scanner hasn't published its push key yet — try again after the first run."; return; }
    const reg = await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ msg.textContent="Notifications weren't allowed."; render(); return; }
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(D.config.vapid_public)});
    const json = JSON.stringify(sub.toJSON());
    localStorage.setItem("insider.sub", json);
    const title = encodeURIComponent("Device: " + (navigator.userAgent.match(/iPhone|iPad|Android|Mac|Windows/)||["phone"])[0] + " " + new Date().toISOString().slice(0,10));
    const body = encodeURIComponent("Push subscription for Insider alerts. Do not edit.\n\n```json\n"+json+"\n```");
    const url = `https://github.com/${D.config.repo}/issues/new?labels=device&title=${title}&body=${body}`;
    msg.innerHTML = `Almost there — <a href="${url}" target="_blank" rel="noopener">open GitHub</a> and tap <b>Submit new issue</b>. Alerts start on the next scan.`;
    window.open(url, "_blank");
  }catch(e){ msg.textContent = "Couldn't subscribe: " + (e.message||e); }
}
async function testPush(){ const reg=await navigator.serviceWorker.ready; reg.showNotification("Insider", {body:"HRBR: strong insider buying · 3 insiders (CEO, CFO, Director) bought $660K at ~$12.48 · score 83", icon:"icons/icon-192.png", badge:"icons/badge-96.png", tag:"insider-test"}); }
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.hash.length>1){ const tk=location.hash.slice(1); tab="alerts"; load().then(()=>{ const a=D.alerts.find(x=>x.ticker===tk); if(a){detail={kind:"alert",id:a.id};render();} }); } else load();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
</body>
