<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Insider</title>
<meta name="description" content="Insider buying and activist stakes that matter, read from SEC filings, scored and explained.">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insider">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--bg2:#11151a;--bg3:#171c23;--line:#222a33;--line2:#2c3641;--ink:#e8ecf1;--ink2:#9aa6b4;--ink3:#5f6b79;
--up:#3ddc97;--up2:rgba(61,220,151,.14);--strong:#ffb547;--strong2:rgba(255,181,71,.14);--down:#ff6b6b;--blue:#6ea8ff;--blue2:rgba(110,168,255,.14);
--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--sans:Inter,-apple-system,system-ui,"Segoe UI",sans-serif;--r:14px;
--pad:16px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--blue);text-decoration:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,rgba(11,13,16,0));padding:calc(10px + var(--safe-t)) var(--pad) 10px;display:flex;align-items:center;gap:10px}
header .mark{width:26px;height:26px;border-radius:7px;background:var(--up);display:grid;place-items:center;color:#06120c;font:700 15px var(--mono)}
header h1{font-size:17px;margin:0;letter-spacing:.2px;flex:1}
header .upd{font:12px var(--mono);color:var(--ink3)}
main{padding:0 var(--pad) calc(84px + var(--safe-b));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(13,16,20,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
display:flex;justify-content:space-around;padding:8px 4px calc(8px + var(--safe-b))}
nav.tabs button{background:none;border:0;color:var(--ink3);font:500 10.5px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--up)}
.what{font-size:13px;color:var(--ink2);line-height:1.5;margin:4px 0 14px;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px}
.what b{color:var(--ink)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px}
.stat .v{font:600 20px/1.1 var(--mono);letter-spacing:-.3px}
.stat .k{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
.stat .v.up{color:var(--up)}.stat .v.down{color:var(--down)}.stat .v.strong{color:var(--strong)}
h2{font-size:12px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);margin:18px 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;position:relative}
.card.tap:active{background:var(--bg3)}
.row{display:flex;align-items:center;gap:10px}
.tk{font:600 18px var(--mono);letter-spacing:-.2px}
.nm{color:var(--ink2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 10.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.pill.Strong{color:var(--strong);border-color:rgba(255,181,71,.45);background:var(--strong2)}
.pill.Notable{color:var(--up);border-color:rgba(61,220,151,.45);background:var(--up2)}
.pill.Weak{color:var(--ink3);border-color:var(--line2)}
.kind{font:600 10px var(--mono);letter-spacing:.7px;text-transform:uppercase;padding:3px 7px;border-radius:6px;white-space:nowrap}
.kind.insider{color:var(--up);background:var(--up2)}
.kind.stake{color:var(--blue);background:var(--blue2)}
.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font:600 13px var(--mono)}
.lead{margin:10px 0 8px;font-size:14.5px;color:var(--ink);line-height:1.45}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font:12.5px var(--mono);color:var(--ink2)}
.facts b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--ink2)}
.chip b{color:var(--ink);font-weight:600}
.spark{width:100%;height:44px;margin-top:10px}
.perf{display:inline-flex;gap:6px;align-items:baseline;font:12.5px var(--mono)}
.perf .up{color:var(--up)}.perf .down{color:var(--down)}
.empty{color:var(--ink3);text-align:center;padding:36px 20px;font-size:14px;line-height:1.6}
.btn{background:var(--up);color:#06120c;border:0;border-radius:11px;padding:12px 16px;font:600 14px var(--sans);width:100%}
.btn.ghost{background:var(--bg3);color:var(--ink);border:1px solid var(--line2)}
.btn:disabled{opacity:.5}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.5}
.search{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink);font:14px var(--sans);outline:0;margin:6px 0 12px}
.search::placeholder{color:var(--ink3)}
.seg{display:flex;gap:6px;margin:4px 0 12px}
.seg button{flex:1;background:var(--bg2);border:1px solid var(--line);color:var(--ink2);border-radius:10px;padding:8px;font:500 13px var(--sans)}
.seg button.on{background:var(--bg3);color:var(--ink);border-color:var(--line2)}
.detail .back{background:none;border:0;color:var(--blue);font:500 14px var(--sans);padding:6px 0 10px;display:flex;align-items:center;gap:4px}
.hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.hd .tk{font-size:30px}
.hd .nm{white-space:normal;font-size:14px}
.bars{display:grid;gap:7px;margin:8px 0 4px}
.bar{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.bar .tr{height:6px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar .fl{height:100%;background:var(--up);border-radius:4px}
.bar .fl.neg{background:var(--down)}
.bar .pv{font:500 12px var(--mono);text-align:right;color:var(--ink)}
ul.reasons{margin:6px 0 0;padding:0 0 0 18px;color:var(--ink2);font-size:13.5px;line-height:1.5}
ul.reasons li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font:600 10.5px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--ink3);text-align:left;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 6px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--mono)}
td .sub,.sub{color:var(--ink3);font-size:11.5px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.kv div{background:var(--bg3);border-radius:10px;padding:9px 10px}
.kv .k{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.kv .v{font:500 14px var(--mono);margin-top:2px}
.take{border-left:3px solid var(--strong);padding:2px 0 2px 12px;margin-top:8px}
.take.Notable{border-color:var(--up)}.take.Weak{border-color:var(--ink3)}
.take b{display:block;margin-bottom:4px;font-size:14px}
.take p{margin:0;color:var(--ink2);font-size:13.5px;line-height:1.55}
.disc{font-size:11.5px;color:var(--ink3);margin-top:14px;line-height:1.5}
.links a{display:inline-block;margin:6px 10px 0 0;font:12.5px var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--bg3);border:1px solid var(--line2);padding:10px 14px;border-radius:12px;font-size:13px;z-index:9;max-width:90vw}
.buy{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.buy .tk{font-size:15px}
.buy .who{color:var(--ink2);font-size:12.5px}
.buy .amt{font:500 13px var(--mono);text-align:right}
.buy .d{font:11.5px var(--mono);color:var(--ink3);text-align:right}
.step{display:flex;gap:10px;margin:10px 0;font-size:13.5px;color:var(--ink2)}
.step i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg3);border:1px solid var(--line2);display:grid;place-items:center;font:600 11px var(--mono);color:var(--ink);font-style:normal}
.ok{color:var(--up)}.warn{color:var(--strong)}
.nm2{font-weight:600;font-size:15px}
.sec{font:600 10.5px var(--mono);letter-spacing:.7px;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
.also{display:grid;grid-template-columns:52px 1fr auto;gap:8px;font-size:12.5px;color:var(--ink2);padding:5px 0;border-bottom:1px solid var(--line)}
.also span:first-child{font-family:var(--mono);color:var(--ink3)}
td.note{font-size:11.5px;color:var(--ink3);padding-top:0;line-height:1.4}
.read{font-size:13.5px;color:var(--ink);line-height:1.5}
.more{font-size:12.5px;color:var(--blue);margin-top:10px}
.card.ins{cursor:pointer}
.q{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);color:var(--ink3);font:600 10px var(--mono);background:none;padding:0;margin-left:4px;vertical-align:middle;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet .box{background:var(--bg2);border:1px solid var(--line2);border-radius:18px 18px 0 0;padding:18px var(--pad) calc(22px + var(--safe-b));width:100%;max-width:720px;margin:0 auto;max-height:80vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:16px}
.sheet p{margin:0;color:var(--ink2);font-size:14px;line-height:1.55}
.intro h3{font-size:22px;margin:4px 0 10px}
.intro .row{align-items:flex-start;gap:12px;margin:12px 0;font-size:13.5px;color:var(--ink2);line-height:1.5}
.intro .row b{color:var(--ink)}
.intro .kind,.intro .pill{margin-top:3px;flex:none}
.quote{border-left:2px solid var(--line2);padding:4px 0 4px 10px;color:var(--ink2);font-size:13px;line-height:1.5;margin-top:8px;font-style:italic}
</style>
</head>
<body>
<header><div class="mark">I</div><h1>Insider</h1><div class="upd" id="upd"></div></header>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button data-tab="insiders"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>Insiders</button>
  <button data-tab="stakes"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V10l7-6 7 6v11"/><path d="M9 21v-6h6v6"/></svg>Big Money</button>
  <button data-tab="browse"><svg viewBox="0 0 24 24"><path d="M4 19V5"/><path d="M8 19v-7"/><path d="M12 19V9"/><path d="M16 19v-4"/><path d="M20 19V7"/></svg>Companies</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Settings</button>
</nav>
<script>
const $ = s => document.querySelector(s);
const D = {summary:null, alerts:[], companies:{}, buys:[], runs:[], config:{}, stakes:[]};
let tab = "home", detail = null;
const fmt = {
  money(v){ if(v==null) return "—"; const a=Math.abs(v); const u=[["T",1e12],["B",1e9],["M",1e6],["K",1e3]]; for(const [s,d] of u) if(a>=d){ const x=v/d; return "$"+(s==="K"||Math.abs(x)>=100?x.toFixed(0):Math.abs(x)>=10?x.toFixed(1):x.toFixed(2))+s; } return "$"+Math.round(v).toLocaleString(); },
  pct(v,d=0){ return v==null?"—":(v>0?"+":"")+(v*100).toFixed(d)+"%"; },
  px(v){ return v==null?"—":"$"+Number(v).toFixed(2); },
  int(v){ return v==null?"—":Math.round(v).toLocaleString(); },
  date(s){ if(!s) return "—"; const d=new Date(s.slice(0,10)+"T00:00:00"); return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); },
  ago(iso){ if(!iso) return ""; const m=Math.round((Date.now()-new Date(iso))/60000); return m<2?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; },
  days(s){ return Math.round((Date.now()-new Date(s.slice(0,10)+"T00:00:00"))/86400000); }
};
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GLOSSARY = {
  "form4": ["Form 4", "The form every officer, director and 10%+ owner must file with the SEC within two business days of trading their own company's stock. The Insiders feed is built from these."],
  "open-market": ["Open-market purchase", "The insider bought shares on the exchange with their own money (SEC code P). This is the only kind of insider trade with a track record of predicting returns — awards, option exercises and tax withholding are excluded."],
  "cluster": ["Cluster", "Two or more different insiders buying within 30 days of each other. Research finds clusters far more predictive than one insider acting alone."],
  "10b5-1": ["10b5-1 plan", "A pre-scheduled trading plan set up months in advance. A buy under one happens automatically, so it says little about what the insider thinks today. Marked down."],
  "indirect": ["Direct vs. indirect", "Direct: held in the insider's own name. Indirect: held through a trust, LLC, spouse or retirement account — still their money, but sometimes a planning move rather than a conviction buy."],
  "stake": ["Stake grew", "How much this purchase increased what the insider already owned. +150% means they more than doubled their position; +2% is a token top-up."],
  "13d": ["Schedule 13D", "Filed within days of crossing 5% ownership by a holder who intends to influence the company (a board seat, a sale, buybacks). Activists file these. The passive version, 13G, is for index funds and is left out."],
  "percent": ["Percent of class", "The share of the company's stock the filer now owns, as stated in the filing."],
  "purpose": ["Stated purpose", "Item 4 of a 13D: the filer's own words on why they bought. 'Investment purposes' is boilerplate; mentions of the board, strategic alternatives or a sale are the tell."],
  "labels": ["Strong · Notable · Weak", "Strong (65+) is the pattern with the best track record and the only one that pushes to your phone. Notable (40–64) has some of the ingredients. Weak is logged for context only."],
  "since": ["Since alert", "How the stock has done from the close on the alert day, next to the S&P 500 over the same days. Judge it after dozens of alerts; single names are noise."],
  "score": ["Score", "0–100, built from the parts shown in the bars. It ranks signals against each other; it is not a probability."],
};
function q(term){ return `<button class="q" onclick="event.stopPropagation();gloss('${term}')">?</button>`; }
function gloss(term){ const g=GLOSSARY[term]; if(!g) return; sheet(`<h3>${esc(g[0])}</h3><p>${esc(g[1])}</p>`); }
function sheet(html){ const s=document.createElement("div"); s.className="sheet"; s.innerHTML=`<div class="box">${html}</div>`; s.onclick=e=>{ if(e.target===s) s.remove(); }; document.body.appendChild(s); return s; }
async function j(name){ try{ const r=await fetch(name+"?t="+Math.floor(Date.now()/60000),{cache:"no-store"}); if(!r.ok) throw 0; return await r.json(); }catch(e){ return null; } }
async function load(){
  const [s,a,c,b,r,cfg,st] = await Promise.all([j("data/summary.json"),j("data/alerts.json"),j("data/companies.json"),j("data/buys.json"),j("data/runs.json"),j("config.json"),j("data/stakes.json")]);
  D.summary=s; D.alerts=(a||[]).slice().reverse(); D.companies=c||{}; D.buys=(b||[]).slice().sort((x,y)=>y.trade_date.localeCompare(x.trade_date)); D.runs=r||[]; D.config=cfg||{}; D.stakes=(st||[]).slice().reverse();
  $("#upd").textContent = s ? "scan " + fmt.ago(s.updated) : "";
  render();
  try{ if(!localStorage.getItem("insider.intro")){ intro(); } }catch(e){}
}
const isStake = a => a.kind==="13d";
function ring(score,label){ const r=18,c=2*Math.PI*r,col=label==="Strong"?"var(--strong)":label==="Notable"?"var(--up)":"var(--ink3)";
  return `<div class="ring"><svg width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" stroke="var(--bg3)" stroke-width="4" fill="none"/><circle cx="22" cy="22" r="${r}" stroke="${col}" stroke-width="4" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-Math.min(score,100)/100)}" stroke-linecap="round"/></svg><div class="t">${score}</div></div>`; }
function spark(pts, markDate){ if(!pts||pts.length<2) return ""; const w=300,h=44,vals=pts.map(p=>p[1]),mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const X=i=>(i/(pts.length-1))*w, Y=v=>h-3-((v-mn)/sp)*(h-6); let d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join(" ");
  const up=vals[vals.length-1]>=vals[0]; let mark=""; if(markDate){ const i=pts.findIndex(p=>p[0]>=markDate); if(i>=0) mark=`<circle cx="${X(i)}" cy="${Y(pts[i][1])}" r="3.2" fill="var(--strong)"/>`; }
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="1.6"/>${mark}</svg>`; }
function headline(a){
  if(isStake(a)){ const v=a.stake_value?` (~${fmt.money(a.stake_value)})`:""; return `<b>${esc(a.lead)}</b> ${a.amendment?"raised its stake to":"disclosed a"} <b class="num">${(a.percent||0).toFixed(1)}%</b> ${a.amendment?"of":"stake in"} ${esc(a.name)}${v}${a.kinds?.includes("activist")?" — a known activist":""}.`; }
  const hb=(a.buyers||[]).filter(b=>!b.fund); const span=a.first_trade&&a.last_trade&&a.first_trade!==a.last_trade?` over ${Math.max(1,Math.round((new Date(a.last_trade)-new Date(a.first_trade))/86400000))} days`:"";
  const rank={"CEO":0,"CFO":1,"Chair":2,"President":3,"COO":4,"C-suite":5,"General Counsel":6,"VP":7,"Officer":8,"Director":9,"10% owner":10,"Insider":11};
  const counts={}; hb.forEach(b=>counts[b.role]=(counts[b.role]||0)+1);
  const roles=Object.keys(counts).sort((x,y)=>(rank[x]??12)-(rank[y]??12)).map(r=>counts[r]>1?`${counts[r]} ${r==="Director"?"directors":r==="VP"?"VPs":r==="Officer"?"officers":r+"s"}`:r==="Director"?"a director":r);
  const who = a.n_insiders===1 ? `The <b>${esc(hb[0]?.role||"insider")}</b>` : `<b>${a.n_insiders} insiders</b> (${roles.slice(0,3).join(" + ")}${roles.length>3?" + more":""})`;
  return `${who} bought <b class="num">${fmt.money(a.total_value)}</b> of ${esc(a.name)} on the open market${span}, at about <span class="num">${fmt.px(a.avg_price)}</span>.`;
}
function card(a){
  const c=a.ctx||{}, p=a.perf||{};
  const perf = (p.ret!=null && p.days>=1) ? `<span class="perf">since alert <b class="${p.ret>=0?"up":"down"}">${fmt.pct(p.ret,1)}</b>${p.spy!=null?`<span style="color:var(--ink3)">S&amp;P ${fmt.pct(p.spy,1)}</span>`:""}</span>` : "";
  const facts = `${c.market_cap?`<span><b>${fmt.money(c.market_cap)}</b> cap</span>`:""}${c.price?`<span>now <b>${fmt.px(c.price)}</b></span>`:""}${c.off_high!=null?`<span><b>${fmt.pct(c.off_high)}</b> vs 52w high</span>`:""}${isStake(a)?`<span>${a.amendment?"amendment":"new 13D"}</span>`:(c.industry?`<span>${esc(c.industry)}</span>`:"")}`;
  return `<div class="card tap" data-alert="${esc(a.id)}">
    <div class="row">${ring(a.score,a.label)}<div style="flex:1;min-width:0"><div class="row" style="gap:8px"><span class="tk">${esc(a.ticker||"—")}</span><span class="kind ${isStake(a)?"stake":"insider"}">${isStake(a)?"13D stake":"Insider buy"}</span><span class="pill ${a.label}">${a.label}</span></div><div class="nm">${esc(a.name)}</div></div><div class="num" style="color:var(--ink3);font-size:12px">${fmt.date(a.date)}</div></div>
    <div class="lead">${headline(a)}</div>
    <div class="facts">${facts}</div>
    ${spark(a.spark,a.date)}${perf?`<div style="margin-top:6px">${perf}</div>`:""}</div>`; }
/* ---------- screens ---------- */
function home(){
  const s=D.summary; if(!s) return `<div class="empty">No scans yet.<br>The first run fills this in within 10 minutes of going live.</div>`;
  const week=D.alerts.filter(a=>fmt.days(a.date)<=7 && a.label!=="Weak").sort((x,y)=>(y.label==="Strong")-(x.label==="Strong")||y.score-x.score);
  const strong=D.alerts.filter(a=>a.label==="Strong").slice(0,3);
  return `<div class="what"><b>Home</b> — the best signals from both feeds. <span class="kind insider">Insider buy</span> executives buying their own stock. <span class="kind stake">13D stake</span> an investor crossing 5% with intent. Tap any card for the full breakdown.</div>
    <div class="strip">
    <div class="stat"><div class="v strong">${s.strong_30d}</div><div class="k">Strong · 30d</div></div>
    <div class="stat"><div class="v">${s.stakes_30d??0}</div><div class="k">13D · 30d</div></div>
    <div class="stat"><div class="v">${fmt.int(s.buys_30d)}</div><div class="k">Buys read</div></div>
    <div class="stat"><div class="v ${s.avg_vs_spy==null?"":s.avg_vs_spy>=0?"up":"down"}">${s.avg_vs_spy==null?"—":fmt.pct(s.avg_vs_spy,1)}</div><div class="k">vs S&amp;P${s.n_perf?` · ${s.n_perf}`:""}</div></div></div>

    ${("Notification" in window) && Notification.permission!=="granted" && standalone() ? `<div class="card"><b>Notifications are off</b><div class="hint" style="margin:4px 0 10px">Turn them on to get Strong signals on your lock screen.</div><button class="btn" onclick="go('settings')">Set up notifications</button></div>`:""}
    <h2>This week ${q("labels")}</h2>${week.length?week.slice(0,8).map(card).join(""):`<div class="empty">Nothing Strong or Notable in the last 7 days. Quiet weeks are normal.</div>`}
    ${week.length<3&&strong.length?`<h2>Most recent Strong</h2>${strong.map(card).join("")}`:""}
    ${s.n_perf?`<h2>Track record ${q("since")}</h2><div class="card"><div class="kv"><div><div class="k">Alerts aged 30d+</div><div class="v">${s.n_perf}</div></div><div><div class="k">Beat the S&amp;P</div><div class="v">${fmt.pct(s.hit_rate)}</div></div><div><div class="k">Avg return</div><div class="v ${s.avg_ret>=0?"ok":"warn"}">${fmt.pct(s.avg_ret,1)}</div></div><div><div class="k">Avg vs S&amp;P</div><div class="v ${s.avg_vs_spy>=0?"ok":"warn"}">${fmt.pct(s.avg_vs_spy,1)}</div></div></div></div>`:""}`;
}
function insiders(){

  return `<div class="what"><b>Insiders</b> — open-market purchases ${q("open-market")} by officers and directors, from SEC Form 4 ${q("form4")}. <b>Signals</b> are scored; <b>All buys</b> is the raw feed, so you can see everything the scanner read.</div>
    <div class="seg"><button class="${mode==="signals"?"on":""}" onclick="D._imode='signals';render()">Signals</button><button class="${mode==="all"?"on":""}" onclick="D._imode='all';render()">All buys</button></div>
    ${mode==="signals"?`<div class="row" style="gap:8px;margin:0 0 12px">${["all","Strong","Notable"].map(k=>`<button class="pill ${k==="all"?"Weak":k}" style="padding:7px 12px;font-size:11.5px;${f===k?"outline:2px solid var(--ink2)":""}" onclick="D._f='${k}';render()">${k==="all"?"All":k}</button>`).join("")}<span style="flex:1"></span><span class="hint">${list.length}</span></div>${list.length?list.map(card).join(""):`<div class="empty">No signals yet.</div>`}`

}
function stakes(){
  const list=D.alerts.filter(isStake);

    <div class="seg"><button class="${mode==="signals"?"on":""}" onclick="D._smode='signals';render()">Signals</button><button class="${mode==="all"?"on":""}" onclick="D._smode='all';render()">All 13D filings</button></div>
    ${mode==="signals"?(list.length?list.map(card).join(""):`<div class="empty">No 13D signals yet. The feed fills from the next scan on; activist stakes arrive a few times a week.</div>`)
    : (all.length?all.map(x=>`<div class="buy"><div><span class="tk">${esc(x.company?.ticker||x.company?.name||x.issuer)}</span> <span class="who">${esc((x.filers||[])[0]?.name||"")}${x.amendment?" · amendment":" · new"}</span></div><div class="amt">${x.percent?x.percent.toFixed(1)+"%":"—"}</div><div class="who">${esc(x.company?.name||"")}${x.score?.label?` · <span class="pill ${x.score.label}" style="padding:1px 6px">${x.score.label}</span>`:""}</div><div class="d">${fmt.date(x.filed)}</div></div>`).join(""):`<div class="empty">No 13D filings read yet.</div>`)}`;
}
function browse(){
  const qq=(D._q||"").toLowerCase(); const rows=Object.values(D.companies).filter(c=>!qq||(c.ticker||"").toLowerCase().includes(qq)||(c.name||"").toLowerCase().includes(qq)).sort((a,b)=>b.score.score-a.score.score||b.updated.localeCompare(a.updated));

function companyRows(rows){ if(!rows.length) return `<div class="empty">Nothing tracked yet.</div>`;
  return rows.slice(0,200).map(c=>`<div class="card tap" data-co="${esc(c.ticker||"cik"+c.cik)}" style="padding:12px 14px"><div class="row">${ring(c.score.score,c.score.label)}<div style="flex:1;min-width:0"><div class="row" style="gap:8px"><span class="tk">${esc(c.ticker||"—")}</span><span class="pill ${c.score.label}">${c.score.label}</span></div><div class="nm">${esc(c.name)}</div></div><div style="text-align:right"><div class="num" style="font-size:13px">${fmt.money(c.score.total_value)}</div><div class="num" style="font-size:11px;color:var(--ink3)">${c.score.n_insiders} insider${c.score.n_insiders===1?"":"s"} · ${fmt.date(c.score.last_trade)}</div></div></div></div>`).join(""); }
function renderList(){ const qq=(D._q||"").toLowerCase(); const rows=Object.values(D.companies).filter(c=>!qq||(c.ticker||"").toLowerCase().includes(qq)||(c.name||"").toLowerCase().includes(qq)).sort((a,b)=>b.score.score-a.score.score); $("#list").innerHTML=companyRows(rows); bind(); }
function activity(){
  const b=D.buys.slice(0,150);

}
function roleOf(o){ const t=(o.title||"").toLowerCase(); if(o.officer||t){ if(/chief exec|\bceo\b/.test(t)) return "CEO"; if(/chief fin|\bcfo\b/.test(t)) return "CFO"; if(/chief oper|\bcoo\b/.test(t)) return "COO"; if(/president/.test(t)) return "President"; if(/chair/.test(t)) return "Chair"; if(/chief/.test(t)) return "C-suite"; if(/vice|\bvp\b|\bevp\b|\bsvp\b/.test(t)) return "VP"; return "Officer"; } if(o.director) return "Director"; if(o.ten_percent) return "10% owner"; return "Insider"; }

      ${D.config.repo?`<div class="links"><a href="https://github.com/${esc(D.config.repo)}/actions" target="_blank" rel="noopener">Run history ↗</a><a href="https://github.com/${esc(D.config.repo)}" target="_blank" rel="noopener">Code ↗</a></div>`:""}

function scoreCard(sc, maxes, labels){
  const pts=sc.points||{};
  const bars=Object.keys(labels).map(k=>{const v=pts[k]||0, m=Math.abs(maxes[k]); return `<div class="bar"><span>${labels[k]}</span><div class="tr"><div class="fl ${v<0?"neg":""}" style="width:${Math.min(100,Math.abs(v)/m*100)}%"></div></div><span class="pv">${v>0?"+":""}${v}</span></div>`;}).join("");
  return `<div class="card"><div class="bars">${bars}</div><ul class="reasons">${(sc.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
}

    <h2>The read</h2><div class="card"><div class="take ${sc.label}"><b>${esc(sc.take?.headline||"")}</b><p>${esc(sc.take?.body||"")}</p></div><div class="facts" style="margin-top:10px"><span>Horizon <b>${esc(sc.take?.horizon||"6–18 months")}</b></span></div></div>
    <h2>The company</h2><div class="card">${companyCard(a)}</div>
    ${filings?`<h2>Filings</h2><div class="card links" style="padding-top:8px">${filings}</div>`:""}
    <div class="disc">Information, not a recommendation. 13D data is the filer's own disclosure.</div></div>`;
  }
  const hl = isCompany ? Object.assign({}, a, {n_insiders:sc.n_insiders, buyers:sc.buyers, total_value:sc.total_value, avg_price:sc.avg_price, first_trade:sc.first_trade, last_trade:sc.last_trade}) : a;
  return top + `
    <h2>What happened</h2><div class="card"><div class="lead" style="margin-top:0">${headline(hl)}</div>
      <div class="kv" style="margin-top:8px"><div><div class="k">Insiders paid</div><div class="v">${fmt.px(sc.avg_price)}</div></div><div><div class="k">Price now</div><div class="v">${fmt.px(c.price)}</div></div><div><div class="k">Buying window</div><div class="v" style="font-size:12.5px">${fmt.date(sc.first_trade)}${sc.last_trade!==sc.first_trade?" – "+fmt.date(sc.last_trade):""}</div></div><div><div class="k">Insiders ${q("cluster")}</div><div class="v">${sc.n_insiders}${sc.n_funds?` <span class="sub">+${sc.n_funds} fund</span>`:""}</div></div></div></div>
    ${perfCard}
    <h2>Why it scores ${sc.score} ${q("score")}</h2>${scoreCard(sc,{cluster:40,role:20,size:30,cap:10,dip:10,penalty:-15},{cluster:"Cluster",role:"Role",size:"Size",cap:"Company size",dip:"Buying a drop",penalty:"Penalties"})}
    <h2>The read</h2><div class="card"><div class="take ${sc.label}"><b>${esc(sc.take?.headline||"")}</b><p>${esc(sc.take?.body||"")}</p></div><div class="facts" style="margin-top:10px"><span>Horizon <b>${esc(sc.take?.horizon||"6–12 months")}</b></span><span>Studied edge <b>${esc(sc.take?.studied_edge||"")}</b></span></div></div>
    <h2>Who bought — tap a name</h2>${(sc.buyers||[]).map((b,i)=>insiderCard(b,i)).join("")}
    <h2>The company</h2><div class="card">${companyCard(a)}</div>
    ${sl?`<h2>Selling on the other side · 90 days</h2><div class="card">${sl.n?`<div class="lead" style="margin-top:0">${sl.n} open-market sale${sl.n===1?"":"s"} totalling <b class="num">${fmt.money(sl.value)}</b></div><div class="chips">${sl.sellers.map(w=>`<span class="chip"><b>${esc(w.role)}</b> ${esc(w.name)} · ${fmt.money(w.value)} · ${fmt.date(w.last)}</span>`).join("")}</div>`:`<div class="hint">No insider sales on file in the last 90 days — the buying isn't being offset by anyone heading for the exit.</div>`}</div>`:""}
    ${filings?`<h2>Filings</h2><div class="card links" style="padding-top:8px">${filings}</div>`:""}
    <div class="disc">Information, not a recommendation. Form 4 data is self-reported and occasionally amended.</div></div>`;
}
/* ---------- plumbing ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  let html;
  if(detail){ html = detail.kind==="alert" ? detailView(D.alerts.find(a=>a.id===detail.id)||{}) : detailView(D.companies[detail.id]||{}, true); }
  else html = {home,insiders,stakes,browse,settings}[tab]();
  $("#main").innerHTML = html; window.scrollTo(0,0); bind();
}
function bind(){
  document.querySelectorAll("[data-alert]").forEach(el=>el.onclick=()=>{detail={kind:"alert",id:el.dataset.alert};render();});
  document.querySelectorAll("[data-co]").forEach(el=>el.onclick=()=>{ if(D.companies[el.dataset.co]){detail={kind:"company",id:el.dataset.co};render();} });
}
function go(t){ tab=t; detail=null; render(); }
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function standalone(){ return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone===true; }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function intro(){
  const s=sheet(`<div class="intro"><h3>What Insider watches</h3>
    <div class="row"><span class="kind insider">Insider buy</span><div><b>Executives buying their own stock</b> with their own money, from SEC Form 4. Best when several insiders buy together, at a smaller company, after a drop. Horizon: 6–12 months.</div></div>
    <div class="row"><span class="kind stake">13D stake</span><div><b>An investor crossing 5%</b> of a company and saying they intend to influence it — activists, funds, wealthy individuals. Best when it's a known activist with a stated plan. Horizon: 6–18 months.</div></div>
    <div class="row"><span class="pill Strong">Strong</span><div>The only label that pushes to your phone. <span class="pill Notable">Notable</span> shows in the app. Weak is logged.</div></div>
    <p style="margin-top:12px">Every card has the same shape: one sentence saying what happened, three facts, a chart, and a tap for the full story — who, why it scores what it does, and what the research says the pattern has meant. Tap any <button class="q">?</button> for a definition.</p>
    <p style="margin-top:10px;font-size:12.5px;color:var(--ink3)">Information, not advice. Nothing here predicts a single stock.</p>
    <button class="btn" style="margin-top:14px" onclick="this.closest('.sheet').remove()">Got it</button></div>`);
  try{ localStorage.setItem("insider.intro","1"); }catch(e){}
  return s;
}
function b64(s){ const p="=".repeat((4-s.length%4)%4), b=(s+p).replace(/-/g,"+").replace(/_/g,"/"), r=atob(b); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
async function subscribe(){
  const msg=$("#submsg");
  try{
    if(!D.config.vapid_public){ msg.textContent="The scanner hasn't published its push key yet — try again after the first run."; return; }
    const reg = await navigator.serviceWorker.ready;
    const perm = await Notification.requestPermission();
    if(perm!=="granted"){ msg.textContent="Notifications weren't allowed."; render(); return; }
    let sub = await reg.pushManager.getSubscription();
    if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(D.config.vapid_public)});
    const json = JSON.stringify(sub.toJSON());
    localStorage.setItem("insider.sub", json);
    const title = encodeURIComponent("Device: " + (navigator.userAgent.match(/iPhone|iPad|Android|Mac|Windows/)||["phone"])[0] + " " + new Date().toISOString().slice(0,10));
    const body = encodeURIComponent("Push subscription for Insider alerts. Do not edit.\n\n```json\n"+json+"\n```");
    const url = `https://github.com/${D.config.repo}/issues/new?labels=device&title=${title}&body=${body}`;
    msg.innerHTML = `Almost there — <a href="${url}" target="_blank" rel="noopener">open GitHub</a> and tap <b>Submit new issue</b>. Alerts start on the next scan.`;
    window.open(url, "_blank");
  }catch(e){ msg.textContent = "Couldn't subscribe: " + (e.message||e); }
}
async function testPush(){ const reg=await navigator.serviceWorker.ready; reg.showNotification("ITG · Strong insider buying · $1.2M", {body:"5 insiders: CEO, CFO, 3 directors · now $4.10 · 65% off high · score 100", icon:"icons/icon-192.png", badge:"icons/badge-96.png", tag:"insider-test"}); }
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.hash.length>1){ const tk=location.hash.slice(1); tab="home"; load().then(()=>{ const a=D.alerts.find(x=>x.ticker===tk); if(a){detail={kind:"alert",id:a.id};render();} }); } else load();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) load(); });
</script>
